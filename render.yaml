services:
  - type: web
    name: echoops-incident-commander
    runtime: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_AGORA_APP_ID
        sync: false
      - key: NEXT_AGORA_APP_CERTIFICATE
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: echoops-db
          property: connectionString
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: JIRA_HOST
        sync: false
      - key: JIRA_EMAIL
        sync: false
      - key: JIRA_API_TOKEN
        sync: false
      - key: PAGERDUTY_ROUTING_KEY
        sync: false

databases:
  - name: echoops-db
    databaseName: echoops
    user: echoops_user
    plan: free
